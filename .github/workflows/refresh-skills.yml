name: Refresh skills

# Weekly re-pull of every skill pack's SKILL.md files. Opens (or updates) a PR
# when upstream changed; CI on that PR then fails until the new or changed
# descriptions are translated in data/skill-translations.json.
on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect skills
        run: npx tsx scripts/collect-skills.ts
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open a PR when upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/skills.json; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c skills-refresh
          git commit -am "chore: refresh skills from upstream"
          git push --force origin skills-refresh
          gh pr view skills-refresh > /dev/null 2>&1 || gh pr create \
            --title "chore: refresh skills from upstream" \
            --body "Upstream SKILL.md files changed. Translate new or changed descriptions in data/skill-translations.json (lib/skills.test.ts lists them), then merge."
