name: Add an Open Source Project
description: Suggest an open source project to add to FindOpenSource.
title: "Add: <project name>"
labels: ["new-project"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a project! If you're comfortable editing a JSON file, you can
        also add it directly via a [pull request](../../blob/main/CONTRIBUTING.md) instead.
  - type: input
    id: name
    attributes:
      label: Project name
      placeholder: Supabase
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub repository
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
      placeholder: https://example.com
    validations:
      required: false
  - type: input
    id: documentation
    attributes:
      label: Documentation
      placeholder: https://example.com/docs
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One sentence describing what the project does.
      placeholder: Open source backend platform with database, auth and storage.
    validations:
      required: true
  - type: input
    id: categories
    attributes:
      label: Categories
      description: Comma-separated. See data/categories.json for valid category slugs.
      placeholder: backend, database, authentication
    validations:
      required: true
  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: Comma-separated words someone might search for.
      placeholder: database, auth, backend-as-a-service
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
    validations:
      required: true
